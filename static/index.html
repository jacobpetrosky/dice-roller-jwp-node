<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>MERNa-NE</title>
</head>
<body>


	<button type="button" onclick="test()">Fetch About</button>
	<div id="roll"></div>

	<script>
		async function test() {
            try {
                const response = await fetch("/api/roll");

                const data = await response.json();

                document.getElementById("roll").textContent =
                    JSON.stringify(data, null, 2);

            } catch (error) {
                console.error(error);
            }
        }
	</script>
</body>
</html>
